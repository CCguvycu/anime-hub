<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⟐ AnimeHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">
    <span class="hdr-glyph">⟐</span>
    <span class="hdr-name">ANIMEHUB</span>
  </div>
  <div class="hdr-search">
    <span class="hdr-search-ico">◈</span>
    <input id="searchInput" type="text" placeholder="Search sites…" autocomplete="off">
  </div>
  <div class="hdr-right">
    <span id="countBadge" class="hdr-count"></span>
    <button id="sbToggle" class="hdr-btn" title="Toggle sidebar">☰</button>
  </div>
</header>

<div class="workspace">

  <!-- ── LEFT: browser sidebar ───────────────────── -->
  <aside id="sidebar" class="sidebar">

    <div class="sb-top">
      <div class="sb-label">◇ CATEGORY</div>
      <div class="cat-list" id="catList">
        <button class="cat-btn active" data-cat="all">All</button>
        <button class="cat-btn" data-cat="streaming">Streaming</button>
        <button class="cat-btn" data-cat="premium">Premium</button>
        <button class="cat-btn" data-cat="dubbed">Dubbed</button>
        <button class="cat-btn" data-cat="manga">Manga</button>
        <button class="cat-btn" data-cat="manhwa">Manhwa</button>
        <button class="cat-btn" data-cat="downloads">Downloads</button>
        <button class="cat-btn" data-cat="info">Info / DB</button>
        <button class="cat-btn" data-cat="news">News</button>
        <button class="cat-btn" data-cat="schedule">Schedule</button>
        <button class="cat-btn" data-cat="community">Community</button>
        <button class="cat-btn" data-cat="learning">Learning</button>
        <button class="cat-btn" data-cat="music">Music</button>
        <button class="cat-btn" data-cat="store">Store</button>
      </div>

      <div class="sb-label" style="margin-top:8px">◇ LANGUAGE</div>
      <div class="lang-row">
        <button class="lbtn active" data-lang="all">ALL</button>
        <button class="lbtn" data-lang="EN">EN</button>
        <button class="lbtn" data-lang="JP">JP</button>
        <button class="lbtn" data-lang="ES">ES</button>
        <button class="lbtn" data-lang="FR">FR</button>
        <button class="lbtn" data-lang="DE">DE</button>
        <button class="lbtn" data-lang="PT">PT</button>
        <button class="lbtn" data-lang="RU">RU</button>
      </div>

      <div class="sb-tools">
        <button id="favFilterBtn" class="tool-btn">★ Favs <span id="favCount">0</span></button>
        <select id="sortSel" class="sort-sel">
          <option value="name">A–Z</option>
          <option value="cat">Category</option>
          <option value="lang">Language</option>
        </select>
      </div>
    </div>

    <div class="sb-list-hdr">
      <span id="listCount" class="list-count"></span>
    </div>

    <div id="siteList" class="sb-list"></div>

  </aside>

  <div id="resizeHandle" class="resize-handle" title="Drag to resize"></div>

  <!-- ── RIGHT: viewer ───────────────────────────── -->
  <div id="viewer" class="viewer">

    <div id="viewerBar" class="viewer-bar hidden">
      <img id="vbIcon" class="vb-icon" src="" alt="">
      <div class="vb-meta">
        <span id="vbName" class="vb-name"></span>
        <a id="vbUrl" class="vb-url" href="#" target="_blank" rel="noopener noreferrer"></a>
      </div>
      <div class="vb-tags" id="vbTags"></div>
      <div class="vb-actions">
        <button id="vbRefresh" class="vb-btn" title="Reload">⟳ Reload</button>
        <a id="vbOpen" class="vb-btn vb-open" href="#" target="_blank" rel="noopener noreferrer">⊞ New Tab</a>
        <button id="vbFav" class="vb-btn">★ Fav</button>
        <button id="vbClose" class="vb-btn vb-x" title="Close">✕</button>
      </div>
    </div>

    <div id="frameWrap" class="frame-wrap">

      <!-- welcome -->
      <div id="welcome" class="welcome">
        <div class="wc-glyph">⟐</div>
        <div class="wc-title">ANIMEHUB</div>
        <div class="wc-sub">Select a site from the left panel — it loads here</div>
        <div class="wc-hint" id="wc-hint"></div>
        <div class="wc-featured" id="wcFeatured"></div>
      </div>

      <!-- loading -->
      <div id="loadOverlay" class="frame-ov hidden">
        <div class="spinner"></div>
        <div class="ov-text" id="loadText">Loading…</div>
      </div>

      <!-- blocked -->
      <div id="blockedOv" class="frame-ov hidden">
        <img id="blIcon" class="bl-icon" src="" alt="">
        <div id="blName" class="bl-name"></div>
        <div class="bl-badge">⚠ EMBEDDING BLOCKED</div>
        <p class="bl-msg">This site uses <code>X-Frame-Options</code> headers to prevent embedding in iframes.<br>This is standard browser security — not an AnimeHub issue.</p>
        <a id="blOpen" class="bl-btn" href="#" target="_blank" rel="noopener noreferrer">⊞ Open in New Tab →</a>
        <div id="blUrl" class="bl-url"></div>
      </div>

      <iframe id="siteFrame" class="site-frame" src="about:blank"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation-by-user-activation">
      </iframe>

    </div>
  </div>

</div>

<script src="sites.js"></script>
<script src="app.js"></script>
</body>
</html>
