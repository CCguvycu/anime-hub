<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⟐ AnimeHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">
    <span class="hdr-glyph">⟐</span>
    <span class="hdr-name">ANIMEHUB</span>
  </div>
  <div class="hdr-search">
    <span class="hdr-search-ico">◈</span>
    <input id="searchInput" type="text" placeholder="Filter sites…" autocomplete="off">
  </div>
  <div class="hdr-right">
    <span id="countBadge" class="hdr-count"></span>
    <button id="sbToggle" class="hdr-btn" title="Toggle sidebar">☰</button>
  </div>
</header>

<div class="workspace">

  <!-- ── LEFT: site directory ───────────────── -->
  <aside id="sidebar" class="sidebar">
    <div class="sb-top">
      <div class="sb-label">◇ CATEGORY</div>
      <div class="cat-list" id="catList">
        <button class="cat-btn active" data-cat="all">All</button>
        <button class="cat-btn" data-cat="streaming">Streaming</button>
        <button class="cat-btn" data-cat="premium">Premium</button>
        <button class="cat-btn" data-cat="dubbed">Dubbed</button>
        <button class="cat-btn" data-cat="manga">Manga</button>
        <button class="cat-btn" data-cat="manhwa">Manhwa</button>
        <button class="cat-btn" data-cat="downloads">Downloads</button>
        <button class="cat-btn" data-cat="info">Info / DB</button>
        <button class="cat-btn" data-cat="news">News</button>
        <button class="cat-btn" data-cat="schedule">Schedule</button>
        <button class="cat-btn" data-cat="community">Community</button>
        <button class="cat-btn" data-cat="learning">Learning</button>
        <button class="cat-btn" data-cat="music">Music</button>
        <button class="cat-btn" data-cat="store">Store</button>
      </div>
      <div class="sb-label" style="margin-top:8px">◇ LANGUAGE</div>
      <div class="lang-row">
        <button class="lbtn active" data-lang="all">ALL</button>
        <button class="lbtn" data-lang="EN">EN</button>
        <button class="lbtn" data-lang="JP">JP</button>
        <button class="lbtn" data-lang="ES">ES</button>
        <button class="lbtn" data-lang="FR">FR</button>
        <button class="lbtn" data-lang="DE">DE</button>
        <button class="lbtn" data-lang="PT">PT</button>
        <button class="lbtn" data-lang="RU">RU</button>
      </div>
      <div class="sb-tools">
        <button id="favFilterBtn" class="tool-btn">★ Favs <span id="favCount">0</span></button>
        <select id="sortSel" class="sort-sel">
          <option value="name">A–Z</option>
          <option value="cat">Category</option>
          <option value="lang">Language</option>
        </select>
      </div>
    </div>
    <div class="sb-list-hdr"><span id="listCount" class="list-count"></span></div>
    <div id="siteList" class="sb-list"></div>
  </aside>

  <div id="resizeHandle" class="resize-handle"></div>

  <!-- ── RIGHT: viewer ─────────────────────── -->
  <div id="viewer" class="viewer">

    <!-- VIEW: Welcome + Anime Search -->
    <div id="viewWelcome" class="view-panel active">
      <div class="wc-inner">
        <div class="wc-glyph">⟐</div>
        <div class="wc-title">ANIMEHUB</div>
        <div class="wc-sub">Search for anime or click a site in the left panel</div>
        <div class="wc-search-wrap">
          <input id="animeSearch" type="text" placeholder="Search anime to watch…" autocomplete="off">
          <button id="animeSearchBtn" class="search-btn">▸ Search</button>
        </div>
        <div class="wc-featured" id="wcFeatured"></div>
      </div>
    </div>

    <!-- VIEW: Search Results -->
    <div id="viewResults" class="view-panel hidden">
      <div class="vr-head">
        <button id="vrBack" class="back-btn">← Back</button>
        <span id="vrQuery" class="vr-query"></span>
        <span id="vrCount" class="vr-count"></span>
      </div>
      <div id="vrGrid" class="vr-grid"></div>
    </div>

    <!-- VIEW: Player -->
    <div id="viewPlayer" class="view-panel hidden">
      <div class="pl-layout">

        <div class="pl-main">
          <div class="pl-src-bar">
            <span class="src-label">◇ SOURCE</span>
            <div id="srcBtnRow" class="src-btns"></div>
            <button id="backToSearch" class="back-btn" style="margin-left:auto">← Back</button>
          </div>
          <div id="playerBox" class="player-box">
            <iframe id="playerFrame" allowfullscreen
              allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
              src="about:blank"></iframe>
          </div>
          <div class="pl-ctrl">
            <div id="playerTitle" class="pl-title"></div>
            <div class="pl-nav">
              <button id="prevEpBtn" class="pvb" disabled>← Prev</button>
              <button id="nextEpBtn" class="pvb" disabled>Next →</button>
              <button id="retryBtn" class="pvb">↺ Retry</button>
              <button id="fsBtn" class="pvb">⛶ Full</button>
            </div>
          </div>
        </div>

        <div class="pl-ep-sidebar">
          <div class="ep-head">
            <span>Episodes</span>
            <span id="epTotal" class="ep-total"></span>
          </div>
          <div id="epList" class="ep-list"></div>
        </div>

      </div>
    </div>

    <!-- VIEW: Site info / launch pad -->
    <div id="viewSite" class="view-panel hidden">
      <div class="site-lp">
        <button id="siteLpBack" class="back-btn" style="margin-bottom:10px">← Back</button>
        <img id="lpIcon" class="lp-icon" src="" alt="">
        <div id="lpName" class="lp-name"></div>
        <div id="lpCat" class="lp-cat"></div>
        <div id="lpDesc" class="lp-desc"></div>
        <a id="lpOpen" class="lp-btn" href="#" target="_blank" rel="noopener noreferrer">⊞ Open Site in New Tab</a>
        <div class="lp-note">Site can't be embedded · <code>X-Frame-Options</code></div>
      </div>
    </div>

  </div>
</div>

<script src="sites.js"></script>
<script src="app.js"></script>
</body>
</html>
